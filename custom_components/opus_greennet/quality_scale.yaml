# Integration quality scale self-assessment for a CUSTOM integration.
#
# This file follows the official rule keys and schema of Home Assistant's
# hassfest (script/hassfest/quality_scale.py). Hassfest validates this file
# only for core integrations, so tests/test_quality_scale.py applies the same
# schema and the applicable official validators in this repository's CI.
#
# It is not an official rating. Home Assistant assigns quality scale tiers only
# to core integrations; manifest.json intentionally declares no quality_scale.
# Evidence for every rule: docs/quality/quality-scale-evidence.md
# Last full re-audit of all 54 rules: phase 13, 2026-10-20, base main 96510dd
# (docs/quality/phases/phase-13.md). Statuses are unchanged by that audit;
# finding F13-1 (rocker event device class) is closed in the same branch.
# Phase 14 (2026-10-20, docs/quality/phases/phase-14.md) adds the optional REST
# transport next to MQTT. It changes reauthentication-flow,
# reconfiguration-flow and inject-websession from exempt to done.
rules:
  # Bronze
  action-setup:
    status: done
    comment: Actions are registered in async_setup and validate entry and device in the handler.
  appropriate-polling:
    status: exempt
    comment: >-
      Push integration (iot_class local_push); no entity polls (should_poll is
      False). On both transports the 60 s gateway uptime probe is a gateway
      endpoint that never queries a radio device; it is pinned by the traffic
      baseline tests. REST entries receive state on the gateway's event stream
      and additionally read the gateway's device list every 30 min (gateway
      model, no radio telegram). Both are documented under docs-data-update.
  brands:
    status: done
    comment: Local brand/ folder (icon, logo, @2x), supported for custom integrations since HA 2026.3.
  common-modules:
    status: done
    comment: >-
      Runtime coordinators in coordinator.py (MQTT) and rest_coordinator.py
      (REST) with one public interface (transport.py), shared base entity in
      entity.py.
  config-flow:
    status: done
    comment: >-
      UI config flow: a menu chooses the MQTT bridge or the REST API; every
      form field has a data_description.
  config-flow-test-coverage:
    status: done
    comment: 100 % gate in CI; every error is followed by a recovering submission.
  dependency-transparency:
    status: done
    comment: The integration has no Python requirements (manifest requirements is empty).
  docs-actions:
    status: done
    comment: README section Services.
  docs-conditions:
    status: exempt
    comment: >-
      The integration provides no conditions (no condition platform and no
      device_condition module).
  docs-high-level-description:
    status: done
    comment: README introduction and Features.
  docs-installation-instructions:
    status: done
    comment: README Prerequisites, MQTT Bridge Setup, REST API Setup and Installation.
  docs-removal-instructions:
    status: done
    comment: README section Removing the integration.
  docs-triggers:
    status: exempt
    comment: >-
      The integration provides no triggers (no trigger platform and no
      device_trigger module). Rocker presses are event entities that work with
      the core state trigger.
  entity-event-setup:
    status: done
    comment: Dispatcher subscriptions are created in async_added_to_hass and released with async_on_remove.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: done
    comment: >-
      Before creating the entry the config flow probes the gateway uptime
      endpoint (MQTT) or reads the gateway's system information and EURID
      (REST).
  test-before-setup:
    status: done
    comment: >-
      async_setup_entry raises ConfigEntryNotReady when the gateway does not
      answer and, for REST entries, ConfigEntryAuthFailed when it rejects the
      credentials or answers as a different gateway.
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: >-
      The integration has no options flow and therefore no configuration
      parameters after setup. The setup values (EAG identifier, or host, port,
      username and password) are documented under docs-installation-parameters.
  docs-installation-parameters:
    status: done
    comment: >-
      README section Configuration describes the EAG identifier (MQTT) and
      host, port, username and password (REST).
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates:
    status: done
    comment: Every platform sets PARALLEL_UPDATES = 0; requests are serialised by the transport queue.
  reauthentication-flow:
    status: done
    comment: >-
      REST entries: rejected credentials or a different gateway at the stored
      address start the reauth flow, which verifies the gateway identity. MQTT
      entries store no credentials; MQTT authentication belongs to the Home
      Assistant MQTT integration.
  test-coverage:
    status: done
    comment: CI enforces more than 95 % per integration module and in total (script/check_coverage.py).

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: done
    comment: >-
      MQTT discovery: manifest mqtt filter EnOcean/+/stream/devices/+/friendlyId
      and async_step_mqtt. A message names a candidate only; since phase 20
      (R4.3) the offer opens the REST form (address, user, password with the
      EURID suggested) and accepts only an address that answers as the
      announced gateway. Requires bridged OPUS topics; manual REST setup is
      always available.
  discovery-update-info:
    status: exempt
    comment: >-
      MQTT discovery announces only the stable EAG identifier, which is the
      unique ID; MQTT entries store no network address. No discovery reports a
      REST address; a changed REST address is entered in the reconfigure flow.
  docs-data-update:
    status: done
    comment: README section Availability and command behavior.
  docs-examples:
    status: done
    comment: README section Examples (rocker control, handle state, alarm, dashboard).
  docs-known-limitations:
    status: done
    comment: README section Known limitations.
  docs-supported-devices:
    status: done
    comment: README section Supported Device Types.
  docs-supported-functions:
    status: done
    comment: README sections Features, Supported Device Types and Services.
  docs-troubleshooting:
    status: done
    comment: README section Troubleshooting.
  docs-use-cases:
    status: done
    comment: README section Use cases, including battery-friendly automation advice.
  dynamic-devices:
    status: done
    comment: Devices discovered after setup are added through dispatcher signals.
  entity-category: done
  entity-device-class:
    status: done
    comment: >-
      Device classes on sensors, binary sensors, covers and rocker events
      (EventDeviceClass.BUTTON, phase 13 finding F13-1 closed).
  entity-disabled-by-default:
    status: done
    comment: >-
      The per-device signal strength sensor and the D2-06-40 handle unlock
      request and mechanics fault diagnostics are disabled for new registry
      entries; existing user enablement is preserved.
  entity-translations: done
  exception-translations: done
  icon-translations:
    status: done
    comment: >-
      icons.json with state icons for the handle position, handle closed,
      unlock request and mechanics fault entities plus service icons; all other
      entities keep their device-class icons. No Python icon properties.
  reconfiguration-flow:
    status: done
    comment: >-
      The reconfigure flow switches a gateway between MQTT and REST or changes
      its REST address and credentials. It rejects an address that answers as
      a different gateway and keeps devices, entities and unique IDs.
  repair-issues:
    status: done
    comment: >-
      Persistent, fixable repair after the one-time removal of a duplicate beta
      entity during unique-ID migration. Transient broker, bridge, gateway or
      radio outages and quiet sensors are intentionally not issues.
  stale-devices:
    status: done
    comment: >-
      async_remove_config_entry_device allows manual removal. Devices are never
      removed automatically because the gateway cannot confirm that a quiet
      EnOcean device is gone.

  # Platinum
  async-dependency:
    status: exempt
    comment: >-
      The integration has no Python requirements. It uses Home Assistant's
      async MQTT API and, for REST entries, aiohttp shipped with Home Assistant
      through its own small async client (api.py).
  inject-websession:
    status: done
    comment: >-
      The REST client receives Home Assistant's shared aiohttp session
      (async_get_clientsession) in the config flow and the entry setup. MQTT
      entries use the Home Assistant MQTT integration.
  strict-typing:
    status: done
    comment: >-
      mypy --strict for every module is a CI gate ([tool.mypy] in pyproject.toml).
      The core .strict-typing file does not apply to a custom integration.
